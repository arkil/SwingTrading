# ─────────────────────────────────────────────────────────────────────────────
#  Out-of-Sample Validation  —  March–May 2025, 1-hour bars
#
#  PURPOSE
#  -------
#  The improved strategy was tuned on Nov 24 2025 – Feb 20 2026 (60 days).
#  This config tests the SAME parameters on a completely separate period to
#  check whether the edge is real or overfitted to that 60-day window.
#
#  TEST PERIOD: 2025-03-01 → 2025-05-30
#  - March 2025 : SPY ranging ~570-590 (moderate vol)
#  - April 2025 : Major tariff-driven crash, SPY -18% (extreme stress test)
#  - May 2025   : Recovery bounce
#  This is a HARDER test than our in-sample period — if the strategy survives
#  the April 2025 regime change, the edge is more credible.
#
#  WHAT IS EXCLUDED vs. in-sample config
#  - require_long_above_sma: false  ← SMA filter was derived from in-sample
#    observations; including it here would not be a clean OOS test
#  - max_adx: 0  ← ADX filter was also tuned in-sample
#
#  WHAT IS UNCHANGED (parameters set before seeing in-sample data)
#  - long_only, require_reentry_confirmation, session 10:00–13:00
#  - hold_bars 3 (=3h on 1h bars), early_exit, cooldown, max_trades_per_day
#  - RSI 30 — the research-backed baseline threshold
#
#  P&L: synthetic leverage model (no Polygon option bars for 2025 dates).
# ─────────────────────────────────────────────────────────────────────────────

data:
  symbol: SPY
  interval: 1h
  period: 730d        # needed so yfinance fetches enough history
  date_start: "2025-03-01"
  date_end:   "2025-05-31"
  timezone: America/New_York
  session_start: "09:30"
  session_end:   "16:00"

strategy:
  name: bollinger_rsi_reversal
  params:
    bb_length: 20
    bb_std:    2.0
    rsi_length: 14
    atr_length: 14
    adx_length: 14
    volume_ma_length: 20

    rsi_oversold:   30
    rsi_overbought: 70

    long_only: true
    require_reentry_confirmation: true
    min_rel_volume: 0

    max_adx: 0                       # disabled — tuned in-sample
    require_long_above_sma: false    # disabled — tuned in-sample

    session_start: "09:30"
    session_end:   "16:00"
    avoid_open_minutes:  30
    avoid_close_minutes: 180

risk:
  capital_per_trade:    1000
  option_target_pct:    0.05
  hold_bars:            3      # 3 × 1h = 3-hour max hold
  option_leverage:      20.0
  stop_atr_mult:        0
  commission_per_trade: 1.0
  cooldown_bars:        1      # 1 × 1h = 1-hour cooldown
  max_trades_per_day:   2
  early_exit_bar:       1
  early_exit_pct:       -0.03

options:
  provider: synthetic
  exit_model: underlying
  dte_target_days: 2
  otm_steps: 1
  use_real_prices_for_pnl: false
  require_real_prices: false
