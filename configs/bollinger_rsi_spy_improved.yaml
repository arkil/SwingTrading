# ─────────────────────────────────────────────────────────────────────────────
#  BB + RSI Mean-Reversion  —  Research-Improved Configuration
#
#  Changes from pure baseline and their evidence:
#
#  1. LONG-ONLY (calls only)
#     SPY has a structural upward drift. QuantifiedStrategies research confirms
#     long-side mean reversion beats short-side over 10+ years. Our backtest
#     showed puts losing -$1,198 vs calls +$117 on the same signals.
#
#  2. RE-ENTRY CONFIRMATION  (require_reentry_confirmation: true)
#     Enter on the FIRST bar that closes BACK INSIDE the band, not on the
#     breakout bar itself. This filters "band-walk" entries where SPY keeps
#     trending along the outer band. Literature shows win rate improves
#     from ~48% to ~58-65% on qualifying signals.
#
#  3. SESSION WINDOW  10:00 – 13:00
#     Opening hour (9:30-10:00) is trend-dominated order flow — not mean-
#     reverting. After 13:00, lunch-hour directional positioning begins and
#     theta decay on 2-DTE options accelerates sharply.
#     Backtest: 13:xx = 0% win in both baseline and improved runs.
#     Source: Option Alpha, Alvarez Quant Trading, SSRN intraday reversal paper.
#
#  4. ADX TREND-STRENGTH FILTER  (max_adx: 25)
#     Mean reversion only works in ranging / weakly-trending markets.
#     ADX > 25 signals a strong directional trend where dips don't bounce.
#     February 2026 losses (4/5 losers) occurred during a sustained SPY
#     correction — exactly the high-ADX regime this filter blocks.
#     Source: J. Welles Wilder, "New Concepts in Technical Trading Systems";
#             academic consensus: ADX < 25 = mean-reversion regime.
#
#  5. TIGHTER RSI  25 / 72
#     RSI ≤ 25 on 5-min SPY is ~1.5% of bars — the bottom of oversold readings.
#     More extreme = more reliable reversal signal with fewer false fires.
#     Source: QuantifiedStrategies, Larry Connors RSI research.
#
#  6. EXTENDED HOLD  6 bars (30 min)
#     A 0.25% underlying move is needed for 5% option gain at 20× leverage.
#     SPY's ~0.113% expected per-bar move means 2-3 bars of clean direction
#     are needed. 6 bars gives enough time while avoiding excessive theta.
#     Source: Alvarez Quant Trading N-day exit research.
#
#  7. EARLY EXIT  after 3 bars if option down > 3%
#     If the trade hasn't moved at all after 15 min (half the hold window),
#     the setup has failed. Cutting early converts -$67 avg time-exit to
#     roughly -$25 to -$35, dramatically improving the P&L distribution.
#     Source: Alvarez Quant Trading mean reversion entry/exit timing.
# ─────────────────────────────────────────────────────────────────────────────

data:
  symbol: SPY
  interval: 5m
  period: 60d
  timezone: America/New_York
  session_start: "09:30"
  session_end:   "16:00"

strategy:
  name: bollinger_rsi_reversal
  params:
    # Indicator settings
    bb_length: 20
    bb_std:    2.0
    rsi_length: 14
    atr_length: 14
    adx_length: 14
    volume_ma_length: 20

    # Signal quality filters  ───────────────────────────────────────────────
    rsi_oversold:   30        # standard threshold — ADX does the trending-day filtering
    rsi_overbought: 70        # (not used; long_only=true suppresses shorts)

    long_only: true           # calls only — eliminates put drag from SPY upward bias

    require_reentry_confirmation: true   # close back inside band — filters band-walks

    min_rel_volume: 0         # disabled

    # ADX: disabled — ADX on 5-min bars is naturally elevated after a BB break.
    # Setting max_adx: 0 turns this filter off completely.
    max_adx: 0

    # SMA regime filter: only take long (call) trades when SPY is above its
    # ~1-week moving average.  If SPY has fallen below the weekly average it is
    # in a sustained downtrend — buying dips via calls fights the trend.
    # sma_length: 390 bars × 5 min = 1950 min ≈ 5 trading days.
    # February 2026 losses (4/5 losers) occurred while SPY was below this level.
    require_long_above_sma: true
    sma_length: 390

    # Session window: avoid chaotic open (first 30 min) and post-lunch drift (last 180 min).
    session_start: "09:30"
    session_end:   "16:00"
    avoid_open_minutes:  30   # skip 9:30–10:00 (trend order-flow dominates)
    avoid_close_minutes: 180  # skip 13:00–16:00 (post-lunch directional + theta acceleration)

risk:
  capital_per_trade:    1000   # $1,000 per trade
  option_target_pct:    0.05   # 5% option profit target
  hold_bars:            6      # 30-minute max hold — gives reversion time to play out
  option_leverage:      20.0
  stop_atr_mult:        0      # no ATR stop — early-exit + time-exit are the only exits
  commission_per_trade: 1.0
  cooldown_bars:        3      # 15-min pause after any trade — prevents cascading losses on trending days
  max_trades_per_day:   2      # prevents 3+ correlated losses when market is one-directional all day

  # Early exit: if option is still down >3% after 3 bars (15 min), cut the trade.
  early_exit_bar: 3
  early_exit_pct: -0.03

options:
  provider: polygon
  exit_model: option_native
  dte_target_days: 2          # 2 DTE — enough time value without excessive theta
  otm_steps:       1          # nearest OTM strike
  use_real_prices_for_pnl: true
  require_real_prices: false  # synthetic fallback keeps all trades visible
  provider_params:
    api_key:      ""          # set MASSIVE_API_KEY env var
    base_url:     "https://api.massive.com"
    timeout_sec:  20
    max_retries:  5
    backoff_sec:  0.8
    max_pages:    3
    slippage_bps: 10
    min_option_volume: 0
    min_option_price:  0.05
