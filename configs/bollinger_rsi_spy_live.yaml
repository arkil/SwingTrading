# ─────────────────────────────────────────────────────────────────────────────
#  Live Trading Config  —  BB + RSI  —  SPY  5m  (Alpaca paper mode)
#
#  SETUP
#  -----
#  1. Create a free Alpaca paper account: https://app.alpaca.markets
#  2. Generate API keys under "Paper Trading" → "API Keys"
#  3. Export credentials:
#       export ALPACA_API_KEY="your_key_id"
#       export ALPACA_SECRET_KEY="your_secret_key"
#  4. Run:
#       dtb-live --config configs/bollinger_rsi_spy_live.yaml
#
#  SWITCHING TO LIVE
#  -----------------
#  Change `broker.mode: live` and use your live account API keys.
#  !! Never commit API keys to git !!
# ─────────────────────────────────────────────────────────────────────────────

broker:
  mode: paper            # paper | live
  api_key: ""            # leave blank — use ALPACA_API_KEY env var
  secret_key: ""         # leave blank — use ALPACA_SECRET_KEY env var

data:
  symbol: SPY
  interval: 5m
  timezone: America/New_York
  session_start: "09:30"
  session_end:   "16:00"

strategy:
  name: bollinger_rsi_reversal
  params:
    bb_length: 20
    bb_std:    2.0
    rsi_length: 14
    atr_length: 14
    adx_length: 14
    volume_ma_length: 20

    rsi_oversold:   35
    rsi_overbought: 70

    long_only: true
    require_reentry_confirmation: true
    min_rel_volume: 0

    max_adx: 0
    require_long_above_sma: true
    sma_length: 390           # 390 × 5m = ~1 trading week

    session_start: "09:30"
    session_end:   "16:00"
    avoid_open_minutes:  30   # skip 9:30–10:00
    avoid_close_minutes: 60   # skip 15:00–16:00

risk:
  capital_per_trade:    1000
  option_target_pct:    0.05   # +5% option return = close
  hold_bars:            6      # 6 × 5m = 30 min max hold
  option_leverage:      20.0
  stop_atr_mult:        0
  commission_per_trade: 1.0
  cooldown_bars:        3      # 3 × 5m = 15 min pause after trade
  max_trades_per_day:   2
  early_exit_bar:       3
  early_exit_pct:       -0.03  # cut if option down >3% after 15 min

options:
  dte_target_days: 2    # minimum 2 DTE
  otm_steps: 1          # 1 strike OTM from ATM
