# ─────────────────────────────────────────────────────────────────────────────
#  BB + RSI  —  QQQ  5-minute  (multi-symbol companion to SPY)
#
#  PURPOSE
#  -------
#  Running the same strategy on QQQ alongside SPY naturally doubles the signal
#  pool without changing any parameters. QQQ (Nasdaq-100) has higher intraday
#  volatility than SPY, so BB band touches are slightly more frequent.
#
#  PARAMETERS: identical to bollinger_rsi_spy_highfreq.yaml
#  - avoid_close_minutes: 60  → session window 10:00 – 15:00
#  - require_reentry_confirmation: true (quality filter kept)
#  - No SMA filter (too restrictive, reduces signals ~70%)
#  - cooldown_bars: 1 (5 min), max_trades_per_day: 4
# ─────────────────────────────────────────────────────────────────────────────

data:
  symbol: QQQ
  interval: 5m
  period: 60d
  timezone: America/New_York
  session_start: "09:30"
  session_end:   "16:00"

strategy:
  name: bollinger_rsi_reversal
  params:
    bb_length: 20
    bb_std:    2.0
    rsi_length: 14
    atr_length: 14
    adx_length: 14
    volume_ma_length: 20

    rsi_oversold:   30
    rsi_overbought: 70

    long_only: true
    require_reentry_confirmation: true
    min_rel_volume: 0

    max_adx: 0
    require_long_above_sma: false

    session_start: "09:30"
    session_end:   "16:00"
    avoid_open_minutes:  30
    avoid_close_minutes: 60    # 10:00 – 15:00 session window

risk:
  capital_per_trade:    1000
  option_target_pct:    0.05
  hold_bars:            6
  option_leverage:      20.0
  stop_atr_mult:        0
  commission_per_trade: 1.0
  cooldown_bars:        1
  max_trades_per_day:   4
  early_exit_bar:       3
  early_exit_pct:       -0.03

options:
  provider: synthetic
  exit_model: underlying
  dte_target_days: 2
  otm_steps: 1
  use_real_prices_for_pnl: false
  require_real_prices: false
