# ─────────────────────────────────────────────────────────────────────────────
#  Long-history validation run  —  1-hour bars, 2 years, synthetic P&L
#
#  Purpose: Yahoo Finance caps 5m/15m/30m data at 60 days. 1h bars go back
#  730 days, giving ~100+ signals across bull, bear, and sideways markets.
#
#  Signal logic is identical to bollinger_rsi_spy_improved.yaml.
#  Bar-time conversions (5m → 1h):
#    hold_bars   6 bars × 5m = 30 min  →  3 bars × 1h (3-hour max)
#    early_exit  3 bars × 5m = 15 min  →  1 bar  × 1h (1-hour check)
#    cooldown    3 bars × 5m = 15 min  →  1 bar  × 1h (1-hour pause)
#
#  P&L: synthetic leverage model (real Polygon option bars not fetched).
#  Compare win rate and signal distribution, not absolute dollar P&L,
#  against the 5m/60d improved run.
# ─────────────────────────────────────────────────────────────────────────────

data:
  symbol: SPY
  interval: 1h
  period: 730d
  timezone: America/New_York
  session_start: "09:30"
  session_end:   "16:00"

strategy:
  name: bollinger_rsi_reversal
  params:
    bb_length: 20
    bb_std:    2.0
    rsi_length: 14
    atr_length: 14
    volume_ma_length: 20

    rsi_oversold:   30
    rsi_overbought: 70

    long_only: true
    require_reentry_confirmation: true
    min_rel_volume: 0

    max_adx: 0
    require_long_above_sma: false   # SMA filter doesn't translate cleanly to 1h timeframe

    session_start: "09:30"
    session_end:   "16:00"
    avoid_open_minutes:  30   # skip 9:30–10:00
    avoid_close_minutes: 180  # skip 13:00–16:00

risk:
  capital_per_trade:    1000
  option_target_pct:    0.05
  hold_bars:            3      # 3 × 1h = 3 hours max hold
  option_leverage:      20.0
  stop_atr_mult:        0
  commission_per_trade: 1.0
  cooldown_bars:        1      # 1 × 1h = 1 hour cooldown
  max_trades_per_day:   2
  early_exit_bar:       1      # check at bar 1 (1 hour in)
  early_exit_pct:       -0.03

options:
  provider: synthetic          # no Polygon calls — faster, uses leverage estimate
  exit_model: underlying
  dte_target_days: 2
  otm_steps: 1
  use_real_prices_for_pnl: false
  require_real_prices: false
